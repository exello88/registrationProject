<div class="profile" (click)="moreInfoActive.emit(false)">
    <div class="profile-info" (click)="$event.stopPropagation()">
        <div class="profile-info-block" *ngIf="userInfo.status !== ''">
            <p class="pi pi-align-left"></p>
            <p class="profile-info-block__title">{{userInfo.status}}</p>
        </div>
        <div class="profile-info-block">
            <p class="pi pi-at"></p>
            <p class="profile-info-block__title">id{{userInfo.id}}</p>
        </div>

        <div class="profile-info-divide"></div>

        <div class="profile-info-block" *ngIf="userInfo.bdate">
            <p class="pi pi-gift"></p>
            <p class="profile-info-block__desctiption" *ngIf="userInfo.bdate!==''">День рождения:</p>
            <p class="profile-info-block__title">{{userInfo.bdate}}</p>
        </div>
        <div class="profile-info-block" *ngIf="userInfo.city!==''">
            <p class="pi pi-map"></p>
            <p class="profile-info-block__desctiption">Город:</p>
            <p class="profile-info-block__title">{{userInfo.city}}</p>
        </div>
        <div class="profile-info-block" *ngIf="userInfo.education!==''">
            <p class="pi pi-book"></p>
            <p class="profile-info-block__desctiption">Место учебы:</p>
            <p class="profile-info-block__title">{{userInfo.education}}</p>
        </div>

        <div class="profile-info-divide"></div>

        <div class="profile-info-activity">
            <div class="profile-info-activity-block">
                <p class="profile-info-activity-block__count">{{subscribeCount}}</p>
                <p class="profile-info-activity-block__title">Подписок</p>
            </div>
            <div class="profile-info-activity-block">
                <p class="profile-info-activity-block__count">{{followersCount}}</p>
                <p class="profile-info-activity-block__title">Подписчиков</p>
            </div>
            <div class="profile-info-activity-block">
                <p class="profile-info-activity-block__count">{{friendsCount}}</p>
                <p class="profile-info-activity-block__title">Друзей</p>
            </div>
        </div>
    </div>
</div>
