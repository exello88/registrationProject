<div class="blur-for-mobile" *ngIf="smallScreen && activeSidebar" (click) = "changeSidebarActive()"></div>

<div class="sidebar" [class.sidebar-active-for-mobile]="smallScreen"
    *ngIf="(smallScreen && activeSidebar) || !smallScreen" (click)="$event.stopPropagation()">
    <div class="sidebar-item" *ngFor="let item of sidebarItems">
        <p class="pi" [ngClass]="item.imgClass"></p>
        <p class="sidebar-item__text">{{ item.text }}</p>
    </div>
</div>
